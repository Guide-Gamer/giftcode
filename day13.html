
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Code Generator | Guide Gamer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(ellipse at top, #321014 0%, transparent 55%),
        #080808;
    color: white;
}

.container {
    width: 100%;
    max-width: 470px;
    padding: 30px;
    border: 1px solid #343434;
    border-radius: 18px;
    background: linear-gradient(145deg, #191919, #101010);
    box-shadow: 0 20px 70px #000c;
    position: relative;
    overflow: hidden;
}

.container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: #ff0033;
    box-shadow: 0 0 18px #ff0033;
}

/* LIVE HEADER */

.live-header {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    margin-bottom: 22px;
}

.live-dot {
    width: 10px;
    height: 10px;
    background: #ff0033;
    border-radius: 50%;
    box-shadow: 0 0 12px #ff0033;
    animation: blink 1.2s infinite;
}

.live-text {
    color: #ff334f;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

/* YOUTUBE AND GIVEAWAY ICONS */

.brand-icons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin: 5px 0 22px;
}

.youtube-icon {
    width: 48px;
    height: 34px;
    color: #ff0033;
    filter: drop-shadow(0 0 10px #ff003366);
}

.youtube-icon svg {
    width: 100%;
    height: 100%;
}

.giveaway-icon {
    font-size: 34px;
    filter: drop-shadow(0 0 9px #ff003366);
}

/* HEADING */

h1 {
    margin: 0;
    text-align: center;
    font-size: 27px;
    letter-spacing: 1px;
    font-weight: 800;
}

h1 span {
    color: #ff0033;
}

.description {
    color: #999;
    text-align: center;
    line-height: 1.6;
    font-size: 13px;
    margin: 13px 0 28px;
}

/* INPUTS */

.section-title {
    font-size: 12px;
    color: #ff465e;
    font-weight: bold;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
}

label {
    display: block;
    margin-top: 21px;
    margin-bottom: 9px;
    color: #ddd;
    font-size: 13px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #393939;
    border-radius: 9px;
    background: #090909;
    color: white;
    font-size: 15px;
    outline: none;
    transition: 0.25s;
}

input:focus {
    border-color: #ff0033;
    box-shadow: 0 0 0 3px #ff003322;
}

input::placeholder {
    color: #666;
}

/* BUTTONS */

button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(100deg, #ff0033, #d90027);
    color: white;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: 0.25s;
}

button:hover {
    background: linear-gradient(100deg, #ff294f, #ed0030);
    box-shadow: 0 5px 25px #ff003344;
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.98);
}

/* MESSAGE */

#message {
    margin-top: 17px;
    font-size: 13px;
    font-weight: bold;
    line-height: 1.5;
    overflow-wrap: anywhere;
    text-align: center;
}

.error {
    color: #ff6464;
}

.success {
    color: #50e89a;
}

/* RESULT */

#result {
    display: none;
    margin-top: 25px;
    animation: appear 0.35s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.result-box {
    padding: 24px 18px;
    border: 1px solid #70212e;
    border-radius: 12px;
    background: linear-gradient(145deg, #211013, #110b0c);
    text-align: center;
}

.result-label {
    color: #ff536c;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
}

#finalCode {
    margin: 20px 0;
    font-size: clamp(34px, 8vw, 43px);
    font-weight: 900;
    letter-spacing: 5px;
    color: white;
    overflow-wrap: anywhere;
    text-shadow: 0 0 20px #ff003355;
}

#copyButton {
    margin-top: 5px;
    background: #292929;
    border: 1px solid #484848;
}

#copyButton:hover {
    background: #383838;
    box-shadow: none;
}

/* FOOTER */

.footer {
    margin-top: 25px;
    padding-top: 17px;
    border-top: 1px solid #292929;
    text-align: center;
    color: #666;
    font-size: 11px;
    letter-spacing: 0.5px;
}

.footer span {
    color: #ff334f;
}


/* ===== GUIDE GAMER: CINEMATIC ARCADE THEME ===== */
:root {
    --hot: #ff174d;
    --hot2: #ff5577;
    --deep: #09070b;
    --muted: #a99da4;
}
html { min-height: 100%; background: var(--deep); }
body {
    position: relative;
    isolation: isolate;
    overflow-x: hidden;
    min-height: 100svh;
    background:
        radial-gradient(ellipse at 50% -8%, rgba(255, 18, 72, .28), transparent 42%),
        radial-gradient(ellipse at 0% 100%, rgba(112, 12, 48, .20), transparent 35%),
        radial-gradient(ellipse at 100% 65%, rgba(255, 40, 90, .11), transparent 30%),
        linear-gradient(135deg, #07070a 0%, #10090e 48%, #08070a 100%);
}
body::before {
    content: "";
    position: fixed;
    z-index: -2;
    inset: 0;
    pointer-events: none;
    opacity: .24;
    background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: linear-gradient(to bottom, black, transparent 90%);
}
body::after {
    content: "";
    position: fixed;
    z-index: -1;
    width: 520px;
    height: 520px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(255, 54, 100, .10);
    border-radius: 50%;
    box-shadow: 0 0 0 38px rgba(255,54,100,.018), 0 0 0 90px rgba(255,54,100,.014), 0 0 100px rgba(255,0,60,.08);
    pointer-events: none;
    animation: backdropPulse 7s ease-in-out infinite;
}
.container {
    width: min(100%, 490px);
    padding: 32px;
    border: 1px solid rgba(255, 90, 125, .30);
    border-radius: 25px;
    background:
        linear-gradient(145deg, rgba(34, 23, 29, .97), rgba(12, 10, 14, .97) 58%),
        #100d11;
    box-shadow: 0 30px 100px rgba(0,0,0,.75), 0 0 55px rgba(255,0,55,.12), inset 0 1px rgba(255,255,255,.08);
    backdrop-filter: blur(20px);
    animation: panelArrival .85s cubic-bezier(.2,.8,.2,1) both, panelBreath 8s ease-in-out 1s infinite;
}
.container::before {
    height: 3px;
    background: linear-gradient(90deg, transparent, #ff174d 18%, #ff9aaf 50%, #ff174d 82%, transparent);
    background-size: 220% 100%;
    box-shadow: 0 0 22px rgba(255,23,77,.9);
    animation: topBeam 4s linear infinite;
}
.container::after {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(255,255,255,.035);
    border-radius: 18px;
    pointer-events: none;
    background:
        radial-gradient(circle at 0 0, rgba(255,65,105,.10), transparent 25%),
        radial-gradient(circle at 100% 100%, rgba(255,65,105,.07), transparent 25%);
}
.live-header, .brand-icons, h1, .description, .section-title, form, #message, #result, .footer {
    position: relative;
    z-index: 2;
}
.live-header {
    width: fit-content;
    margin: 0 auto 24px;
    padding: 8px 15px;
    border: 1px solid rgba(255,55,95,.24);
    border-radius: 99px;
    background: rgba(255,20,65,.07);
    box-shadow: 0 0 24px rgba(255,0,55,.08), inset 0 0 12px rgba(255,0,55,.05);
}
.live-dot {
    box-shadow: 0 0 0 5px rgba(255,0,51,.10), 0 0 18px #ff1744;
    animation: livePulse 1.6s ease-in-out infinite;
}
.live-text { text-shadow: 0 0 15px rgba(255,50,90,.55); }
.brand-icons {
    gap: 22px;
    margin: 5px 0 25px;
}
.youtube-icon, .giveaway-icon {
    transition: transform .35s cubic-bezier(.2,.8,.2,1), filter .35s ease;
    animation: iconFloat 4s ease-in-out infinite;
}
.giveaway-icon { animation-delay: -.9s; }
.youtube-icon:hover, .giveaway-icon:hover {
    transform: translateY(-7px) rotate(-5deg) scale(1.12);
    filter: drop-shadow(0 0 18px rgba(255,20,70,.8));
}
h1 {
    font-size: clamp(30px, 7vw, 37px);
    letter-spacing: 2.5px;
    text-shadow: 0 5px 30px rgba(255,0,60,.16);
}
h1 span {
    text-shadow: 0 0 12px rgba(255,23,77,.65), 0 0 32px rgba(255,23,77,.28);
}
.description { color: var(--muted); max-width: 340px; margin-left: auto; margin-right: auto; }
.section-title {
    display: flex;
    align-items: center;
    gap: 11px;
    color: #ff718b;
}
.section-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(255,75,110,.55), transparent);
}
label {
    color: #f0e8ec;
    letter-spacing: .45px;
}
input {
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    background: rgba(5,5,8,.76);
    box-shadow: inset 0 3px 10px rgba(0,0,0,.30);
    transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease, background .25s ease;
}
input:hover { border-color: rgba(255,95,130,.55); background: rgba(12,7,11,.95); }
input:focus {
    border-color: #ff426b;
    background: #10090e;
    box-shadow: 0 0 0 4px rgba(255,23,77,.12), 0 0 25px rgba(255,23,77,.12), inset 0 2px 8px rgba(0,0,0,.25);
    transform: translateY(-2px);
}
input::placeholder { color: #756a70; }
button {
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;
    background: linear-gradient(105deg, #ff174d 0%, #e6003b 48%, #a90032 100%);
    box-shadow: 0 9px 26px rgba(255,0,55,.22), inset 0 1px rgba(255,255,255,.25);
    transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
}
button::before {
    content: "";
    position: absolute;
    top: -80%;
    left: -65%;
    width: 38%;
    height: 260%;
    transform: rotate(25deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    transition: left .7s ease;
    pointer-events: none;
}
button:hover::before { left: 140%; }
button:hover {
    filter: brightness(1.12);
    box-shadow: 0 12px 34px rgba(255,0,55,.34), 0 0 22px rgba(255,30,80,.14);
    transform: translateY(-3px);
}
button:active { transform: translateY(0) scale(.985); }
#message {
    border-radius: 10px;
    overflow-wrap: anywhere;
}
#message:not(:empty) {
    padding: 11px 13px;
    border: 1px solid rgba(255,255,255,.07);
    background: rgba(255,255,255,.035);
    animation: messagePop .3s ease both;
}
.success { color: #69f5b2; }
.error { color: #ff8192; }
#result { animation: resultArrival .5s cubic-bezier(.2,.8,.2,1) both; }
.result-box {
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,75,110,.55);
    border-radius: 16px;
    background:
        radial-gradient(ellipse at 50% 0%, rgba(255,23,77,.20), transparent 65%),
        linear-gradient(145deg, #261319, #100b0f 75%);
    box-shadow: inset 0 1px rgba(255,255,255,.08), 0 15px 38px rgba(0,0,0,.3), 0 0 30px rgba(255,0,55,.08);
}
.result-box::before {
    content: "✦";
    position: absolute;
    top: 15px;
    left: 18px;
    color: rgba(255,130,155,.7);
    font-size: 18px;
    animation: twinkle 2.8s ease-in-out infinite;
}
.result-box::after {
    content: "✧";
    position: absolute;
    right: 18px;
    bottom: 15px;
    color: rgba(255,130,155,.7);
    font-size: 22px;
    animation: twinkle 3.2s ease-in-out -1s infinite;
}
.result-label { color: #ff8299; }
#finalCode {
    letter-spacing: clamp(2px, 1.5vw, 6px);
    text-shadow: 0 0 13px rgba(255,23,77,.5), 0 0 36px rgba(255,23,77,.22);
    animation: tokenReveal .6s cubic-bezier(.15,.85,.25,1) both;
}
#copyButton {
    border: 1px solid rgba(255,100,135,.25);
    background: linear-gradient(110deg, #33252d, #1a151b);
    box-shadow: inset 0 1px rgba(255,255,255,.06);
}
#copyButton:hover {
    background: linear-gradient(110deg, #49303b, #21171e);
    box-shadow: 0 0 24px rgba(255,30,80,.16);
}
.footer {
    color: #81747b;
    letter-spacing: 1px;
}
.footer span { text-shadow: 0 0 14px rgba(255,23,77,.4); }
@keyframes panelArrival {
    from { opacity: 0; transform: translateY(28px) scale(.965); filter: blur(7px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
@keyframes panelBreath {
    0%,100% { box-shadow: 0 30px 100px rgba(0,0,0,.75), 0 0 42px rgba(255,0,55,.09), inset 0 1px rgba(255,255,255,.08); }
    50% { box-shadow: 0 30px 100px rgba(0,0,0,.75), 0 0 65px rgba(255,0,55,.17), inset 0 1px rgba(255,255,255,.08); }
}
@keyframes topBeam { to { background-position: 220% 0; } }
@keyframes backdropPulse { 0%,100% { opacity: .45; scale: .96; } 50% { opacity: 1; scale: 1.04; } }
@keyframes livePulse { 0%,100% { opacity: 1; box-shadow: 0 0 0 4px rgba(255,0,51,.12), 0 0 16px #ff1744; } 50% { opacity: .55; box-shadow: 0 0 0 8px rgba(255,0,51,.035), 0 0 7px #ff1744; } }
@keyframes iconFloat { 0%,100% { translate: 0 0; } 50% { translate: 0 -5px; } }
@keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.8) rotate(0); } 50% { opacity: 1; transform: scale(1.25) rotate(35deg); } }
@keyframes resultArrival { from { opacity: 0; transform: translateY(15px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes tokenReveal { from { opacity: 0; transform: scale(.82); filter: blur(7px); } to { opacity: 1; transform: scale(1); filter: blur(0); } }
@keyframes messagePop { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 520px) {
    body { padding: 14px; }
    .container { padding: 27px 21px; border-radius: 21px; }
    .container::after { inset: 6px; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
}

    animation: systemBlink 3s ease-in-out infinite;
}
@keyframes systemBlink { 0%,100% { opacity: .45; } 50% { opacity: 1; text-shadow: 0 0 10px rgba(85,234,255,.5); } }
@media (max-width: 520px) {
    .container { border-radius: 7px 19px 7px 19px; }
}


/* SIMPLE GAMING HEADING — TRUE CENTER ALIGNMENT */
.container > h1 {
    display: block;
    width: 100%;
    box-sizing: border-box;
    position: relative;
    margin: 22px 0 18px;
    padding: 8px 0 13px;
    text-align: center;
    font-size: clamp(40px, 7vw, 62px);
    line-height: 1;
    letter-spacing: 3px;
    font-weight: 900;
    color: #eafaff;
    text-shadow: none;
    filter: none;
    animation: none;
}
.container > h1::before {
    content: "EXCLUSIVE REWARDS";
    display: block;
    margin-bottom: 9px;
    color: #ff476d;
    font-family: Arial, sans-serif;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 3px;
}
.container > h1::after {
    content: "";
    position: absolute;
    left: 10%;
    right: 10%;
    bottom: 0;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, #55eaff, transparent);
}
.container > h1 span {
    color: #55eaff;
    text-shadow: none;
    filter: none;
}
@media (max-width: 480px) {
    .container > h1 { letter-spacing: 2px; }
    .container > h1::before { font-size: 8px; letter-spacing: 2px; }
}
</style>
</head>

<body>

<div class="container">

    <!-- LIVE HEADER -->

    <div class="live-header">
        <div class="live-dot"></div>
        <div class="live-text">LIVE GIVEAWAY</div>
    </div>

    <!-- YOUTUBE AND GIVEAWAY SYMBOLS -->

    <div class="brand-icons">

        <div class="youtube-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/>
            </svg>
        </div>

    

    </div>

    <!-- MAIN HEADING -->

    <h1>GIFT<span>CODE</span></h1>

    <p class="description">
        Enter your UID and a valid Gift Code
        to generate your unique Token ID.
        Each ID is valid for one gift code.
    </p>

    <div class="section-title">PLAYER INFORMATION</div>

    <form id="generatorForm">

        <label for="uid">PLAYER UID</label>

        <input
            type="text"
            id="uid"
            inputmode="numeric"
            placeholder="Enter player UID"
            required
        >

        <label for="giftcode">GIFT CODE</label>

        <input
            type="text"
            id="giftcode"
            placeholder="Enter your gift code"
            autocomplete="off"
            required
        >

        <button type="submit">
            GENERATE TOKEN ID
        </button>

    </form>

    <div id="message" role="status"></div>

    <div id="result">

        <div class="result-box">

            <div class="result-label">
                YOUR GENERATED TOKEN ID
            </div>

            <div id="finalCode"></div>

            <button type="button" id="copyButton">
                COPY ID AGAIN
            </button>

        </div>

    </div>

    <!-- FOOTER -->

    <div class="footer">
        POWERED BY <span>GUIDE GAMER</span>
    </div>

</div>

<script>

// ======================================
// 
// ======================================

const GIFT_CODE_MULTIPLIERS = {
     "OPEN13": 3300,
};


// ======================================
// 
// ======================================

const form = document.getElementById("generatorForm");
const message = document.getElementById("message");
const result = document.getElementById("result");

let numberToCopy = "";


async function copyText(text) {

    if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
    }

    
    const temp = document.createElement("textarea");

    temp.value = text;
    temp.setAttribute("readonly", "");
    temp.style.position = "fixed";
    temp.style.left = "-9999px";

    document.body.appendChild(temp);
    temp.select();

    const copied = document.execCommand("copy");

    temp.remove();

    if (!copied) {
        throw new Error("Clipboard access blocked");
    }
}


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.textContent = "";
    message.className = "";
    result.style.display = "none";
    numberToCopy = "";

    const uid = document.getElementById("uid").value.trim();

    const giftCode = document.getElementById("giftcode")
        .value.trim().toUpperCase();


    
    if (!/^\d+$/.test(uid) || uid.length < 5) {

        message.textContent =
            "❌ Invalid UID! Enter at least 5 digits.";

        message.className = "error";
        return;
    }


    
    const multiplier = GIFT_CODE_MULTIPLIERS[giftCode];

    if (multiplier === undefined) {

        message.textContent =
            "❌ WRONG GIFTCODE! Please enter a valid gift code.";

        message.className = "error";
        return;
    }


    
    const firstFive = uid.substring(0, 5);


    
    const calculation =
        BigInt(firstFive) * BigInt(multiplier) + 4921n;


    
    const generatedNumber =
        calculation.toString().substring(0, 5);


   
    numberToCopy = generatedNumber;

    document.getElementById("finalCode").textContent =
        generatedNumber;

    result.style.display = "block";


    
    try {

        await copyText(generatedNumber);

        message.textContent =
            "✅ Token ID generated and copied successfully!";

        message.className = "success";

    } catch (error) {

        message.textContent =
            "⚠️ Token ID generated, but automatic copying was blocked. Click Copy Number Again.";

        message.className = "error";
    }

});




document.getElementById("copyButton")
    .addEventListener("click", async function() {

        if (!numberToCopy) {
            return;
        }

        try {

            await copyText(numberToCopy);

            message.textContent =
                "✅ Token ID copied successfully!";

            message.className = "success";

        } catch (error) {

            message.textContent =
                "⚠️ Copy blocked. Select the displayed number and copy it manually.";

            message.className = "error";
        }

    });

</script>

</body>
</html>
