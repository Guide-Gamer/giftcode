
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Code Generator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #080d18;
    color: white;
}

.container {
    width: 100%;
    max-width: 480px;
    padding: 28px;
    border: 1px solid #29364d;
    border-radius: 20px;
    background: #10182a;
    box-shadow: 0 15px 50px #0008;
}

h1 {
    margin-top: 0;
    text-align: center;
    color: #8daeff;
}

.description {
    color: #aab6ca;
    text-align: center;
    line-height: 1.5;
}

label {
    display: block;
    margin-top: 20px;
    margin-bottom: 8px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #3b4962;
    border-radius: 10px;
    background: #080d18;
    color: white;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #8daeff;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(100deg, #6388ff, #9a6bff);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

#message {
    margin-top: 15px;
    font-weight: bold;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.error {
    color: #ff7373;
}

.success {
    color: #79e6a0;
}

#result {
    display: none;
    margin-top: 25px;
}

.result-box {
    padding: 22px;
    border: 1px solid #34466a;
    border-radius: 12px;
    background: #0b1427;
    text-align: center;
}

.result-label {
    color: #aab6ca;
    font-size: 13px;
    letter-spacing: 1px;
}

#finalCode {
    margin: 18px 0;
    font-size: clamp(24px, 6vw, 34px);
    font-weight: bold;
    overflow-wrap: anywhere;
    word-break: break-word;
}

#copyButton {
    background: #263653;
}
</style>
</head>

<body>

<div class="container">

    <h1>GIFT CODE</h1>

    <p class="description">
        Enter your UID and gift code to generate.
    </p>

    <form id="generatorForm">

        <label for="uid">Player UID</label>
        <input
            type="text"
            id="uid"
            inputmode="numeric"
            placeholder="Enter player number"
            required
        >

        <label for="giftcode">Gift Code</label>
        <input
            type="text"
            id="giftcode"
            placeholder="Enter gift code"
            autocomplete="off"
            required
        >

        <button type="submit">
            Generate Gift Code
        </button>

    </form>

    <div id="message" role="status"></div>

    <div id="result">

        <div class="result-box">

            <div class="result-label">
                FINAL GIFTCODE
            </div>

            <div id="finalCode"></div>

            <button type="button" id="copyButton">
                Copy Again
            </button>

        </div>

    </div>

</div>
